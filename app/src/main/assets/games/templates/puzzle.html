<body style="margin:0;background:#161a24">

<script>
'use strict';
// =====================================================================
// PART SWAP - match-3 puzzle. Swipe a part (or tap two neighbours) to swap, line up 3+ of a kind.

// TO RETHEME: change CONFIG only. Every "CUSTOMIZE:" line is safe to edit.
// =====================================================================
const CONFIG = {

  shop: "Mike's Auto Repair",         // CUSTOMIZE: business name

  player: 'MECHANIC',                 // CUSTOMIZE: name on the high-score board
  text: {                             // CUSTOMIZE: any wording (keep it short)

    level: 'LEVEL', best: 'BEST', top: 'TOP SCORES', shuffle: 'SHUFFLE', noMoves: 'NO MOVES - SHUFFLING', bonus: 'MOVE BONUS', paused: 'PAUSED', resume: 'Tap to resume',

    { name: 'Tire', color: '#3f8ef0' }, { name: 'Wrench', color: '#f2872e' }, { name: 'Oil', color: '#8a63d2' },
    { name: 'Piston', color: '#e05260' }, { name: 'Spark Plug', color: '#27b5a4' }, { name: 'Battery', color: '#d9a400' }
  ],
  moves: 20,                          // CUSTOMIZE: moves per level
  goals: [500, 900, 1400, 2000, 2700], // CUSTOMIZE: goal score for each level (later levels add +800 each)
  shuffles: 2,                        // CUSTOMIZE: free shuffles per level
  music: { bpm: 112, tracks: [        // CUSTOMIZE: tune (notes like C4 F#3, "." = rest)
    { w: 'triangle', v: .12, p: 'C4 . E4 . G4 . E4 . A3 . C4 . E4 . C4 .' },
    { w: 'sine', v: .2, p: 'C3 . . . . . . . A2 . . . . . . .' },

// ---------------------------------------------------------------- setup
const J = Juice, T = CONFIG.text, C = CONFIG.colors, PI2 = Math.PI * 2, PARTS = CONFIG.parts, NP = Math.min(6, PARTS.length), COLS = 7, ROWS = 8, cv = document.getElementById('c');

J.fit(cv, { w: 360, h: 640, min: .5, max: 1.8, bg: C.bg });
J.swipeLive = 1;

let ui = [], uiNext = [];
function button(c, s, x, y, w, h, fn, col, tc) {

  c.save(); c.translate(x, y); c.scale(k, k);
  c.fillStyle = 'rgba(0,0,0,.4)'; J.rr(c, -w / 2, -h / 2 + 5, w, h, h / 3); c.fill();
  c.fillStyle = col || C.accent; J.rr(c, -w / 2, -h / 2, w, h, h / 3); c.fill();

}
J.on('tap', (x, y) => { for (const b of ui) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { J.play('click'); b.fn(); return; } });
const snd = J.btn({ x: () => J.W - 62, y: 28, r: 19, label: (c, x, y) => J.icon(c, 'snd', x, y, 20, J.opts.sound), onpress: () => J.setOpt('sound'), key: 'KeyM' });
const pause = J.btn({ x: () => J.W - 24, y: 28, r: 19, label: (c, x, y) => J.icon(c, 'pause', x, y, 18), onpress: () => J.pause(), key: 'KeyP' });

ctrlOn(false);

// ---------------------------------------------------------------- board
let g = [], cs = 44, bx = 0, by = 0, sel = null, downT = null, busy = false, idleT = 0, score = 0, total = 0, moves = 0, goal = 0, lv = 0, st = 'title', combo = 0, shuf = 0, hint = null, rank = 0, bonus = 0, tt = 0, msg = '', msgT = 0;
const goalFor = n => n < CONFIG.goals.length ? CONFIG.goals[n] : CONFIG.goals[CONFIG.goals.length - 1] + 800 * (n - CONFIG.goals.length + 1);
function layout() {

}
J.on('resize', layout);

}

}

  }
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS;) {
    let k = r; while (k + 1 < ROWS && g[k + 1][c] && g[r][c] && g[k + 1][c].t === g[r][c].t) k++;

}
function swap(a, b) { g[a.r][a.c] = b; g[b.r][b.c] = a; [a.r, b.r] = [b.r, a.r]; [a.c, b.c] = [b.c, a.c]; tween(a, .14); tween(b, .14); }
function trySwap(a, b) {

  for (const t of s) { cx += t.x; cy += t.y; J.burst(t.x + cs / 2, t.y + cs / 2, { n: 7, color: [PARTS[t.t].color, '#fff'], spd: [60, 210], grav: 320, size: [2, 5], life: [.3, .7] }); J.tween(t, { s: 0, a: 0 }, .18, { ease: 'inQuad' }); }
  cx = cx / n + cs / 2; cy = cy / n + cs / 2;
  J.text(cx, cy, '+' + pts, { size: 20 + Math.min(combo, 5) * 3, color: C.gold });
  const big = n >= 5 || combo >= 3; J.feel(big ? 'large' : n >= 4 || combo >= 2 ? 'medium' : 'small', cx, cy, PARTS[[...s][0].t].color);
  if (combo >= 2 || n >= 4) { const w = T.praise[Math.min(T.praise.length - 1, Math.max(combo - 1, n - 4))]; J.text(J.W / 2, by - 8, w + (combo > 1 ? ' x' + combo : ''), { size: 30, color: C.accent, life: 1.1 }); }
  J.tone(J.hz(['C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'D6'][Math.min(combo - 1, 6)]), .18, 'triangle', .16);
  J.after(.2, () => { for (const t of s) g[t.r][t.c] = null; collapse(); });
}
function collapse() {
  let maxD = 0;

    for (let r = w, k = 0; r >= 0; r--, k++) { const t = mk(c, r, Math.floor(Math.random() * NP)); t.y = by - (k + 1) * cs; g[r][c] = t; fall(t); }

function afterMove() {

}

  J.burst(J.W / 2, J.H * .3, { n: 60, color: PARTS.map(p => p.color), grav: 260, spd: [80, 340], life: [.8, 1.6], size: [3, 7] });
}
function gameOver() { st = 'over'; ctrlOn(false); rank = J.hs.add(total); J.music.stop(); J.play('lose'); J.vibe([60, 40, 100]); }
function startLevel() { goal = goalFor(lv); score = 0; moves = CONFIG.moves; shuf = CONFIG.shuffles; busy = false; sel = hint = null; idleT = 0; combo = 0; newBoard(); J.clearFx(); st = 'play'; ctrlOn(true); }
function newGame() { total = 0; lv = 0; rank = 0; startLevel(); J.music.start(CONFIG.music); }
function nextLevel() { lv++; startLevel(); }
function doShuffle() { if (busy || st !== 'play' || shuf <= 0) return; shuf--; busy = true; reroll(); J.after(.5, () => { busy = false; }); }

// input: tap a tile then a neighbour, or swipe from a tile
const tileAt = (x, y) => { const c = Math.floor((x - bx) / cs), r = Math.floor((y - by) / cs); return c >= 0 && c < COLS && r >= 0 && r < ROWS ? g[r][c] : null; };
J.on('down', (x, y) => {

});
J.on('swipe', dir => {

function update(dt) {
  tt += dt; msgT = Math.max(0, msgT - dt);
  if (st !== 'play') return;
  for (const row of g) for (const t of row) if (t && t.sq > 0) t.sq = Math.max(0, t.sq - dt * 4);

}

// ---------------------------------------------------------------- drawing
function icon(c, i, u) {

  else if (i === 1) { c.rotate(-.8); c.lineWidth = u * .55; c.beginPath(); c.moveTo(0, -u * .7); c.lineTo(0, u * 1.3); c.stroke(); c.beginPath(); c.arc(0, -u * 1.0, u * .78, .6, Math.PI * 2 - .6 + Math.PI, false); c.lineWidth = u * .5; c.stroke(); }
  else if (i === 2) { c.beginPath(); c.moveTo(0, -u * 1.35); c.bezierCurveTo(u * .3, -u * .7, u * 1.0, -u * .2, u * 1.0, u * .5); c.arc(0, u * .5, u * 1.0, 0, Math.PI); c.bezierCurveTo(-u * 1.0, -u * .2, -u * .3, -u * .7, 0, -u * 1.35); c.fill(); }
  else if (i === 3) { c.fillRect(-u * .9, -u * 1.2, u * 1.8, u * 1.1); c.lineWidth = u * .4; c.beginPath(); c.moveTo(0, -u * .1); c.lineTo(0, u * .9); c.stroke(); c.beginPath(); c.arc(0, u * 1.1, u * .35, 0, PI2); c.fill(); c.globalAlpha = .45; c.fillStyle = '#000'; c.fillRect(-u * .9, -u * .8, u * 1.8, u * .16); }
  else if (i === 4) { c.fillRect(-u * .22, -u * 1.45, u * .44, u * .5); c.fillRect(-u * .5, -u * .95, u, u * .9); c.beginPath(); for (let k = 0; k < 6; k++) c.lineTo(Math.cos(k * 1.0472) * u * .85, u * .35 + Math.sin(k * 1.0472) * u * .45); c.fill(); c.lineWidth = u * .22; c.beginPath(); c.moveTo(0, u * .75); c.lineTo(0, u * 1.35); c.stroke(); }
  else { J.rr(c, -u * 1.15, -u * .75, u * 2.3, u * 1.7, u * .25); c.fill(); c.fillRect(-u * .85, -u * 1.05, u * .5, u * .35); c.fillRect(u * .35, -u * 1.05, u * .5, u * .35); c.globalAlpha = .55; c.fillStyle = '#000'; c.fillRect(-u * .6, u * .05, u * .5, u * .22); c.fillRect(u * .35, u * .05, u * .5, u * .22); c.fillRect(u * .48, -u * .08, u * .22, u * .5); }

}
function drawTile(c, t, big) {
  if (t.a <= 0.01) return; const p = PARTS[t.t], k = (t.s + Math.sin(t.sq * 8) * .08 * t.sq) * (big || 1), m = cs / 2; if (k <= 0.01) return;

  J.txt(c, T.moves, W / 2 + 6, 24, { size: 12, color: '#aab4c0' }); J.txt(c, moves, W / 2 + 6, 50, { size: 30, color: moves <= 3 ? C.hurt : C.text });
  c.fillStyle = 'rgba(0,0,0,.45)'; J.rr(c, x0, 76, bw, 14, 7); c.fill(); c.fillStyle = C.good; J.rr(c, x0, 76, Math.max(14, bw * Math.min(1, score / goal)), 14, 7); c.fill();

  }
