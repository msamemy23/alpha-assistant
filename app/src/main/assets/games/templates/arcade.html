<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12151c">
<title>Lug Nut Breaker</title>
</head>
<body style="margin:0;background:#12151c">
<canvas id="c"></canvas>
<script src="../juice.js"></script>
<script>
'use strict';
// =====================================================================
// LUG NUT BREAKER - one-screen arcade (breakout style). Drag to slide the wrench.
// TO RETHEME: change CONFIG only. Every "CUSTOMIZE:" line is safe to edit.
// =====================================================================
const CONFIG = {
  id: 'lugnut-breaker',              // CUSTOMIZE: unique short id (keeps saved scores separate per game)
  title: 'LUG NUT BREAKER',          // CUSTOMIZE: game title (also update <title> above)
  tagline: 'Smash the tire stack!',  // CUSTOMIZE: one line under the title
  shop: "Mike's Auto Repair",        // CUSTOMIZE: business name, shown on title and game-over screens
  cta: 'Free tire rotation with any oil change!', // CUSTOMIZE: message on the game-over screen
  player: 'MECHANIC',                // CUSTOMIZE: name shown on the high-score board
  text: {                            // CUSTOMIZE: any wording (keep it short)
    play: 'PLAY', again: 'PLAY AGAIN', score: 'SCORE', level: 'LEVEL', best: 'BEST', over: 'GAME OVER',
    clear: 'LEVEL CLEAR!', launch: 'TAP TO LAUNCH', paused: 'PAUSED', resume: 'Tap to resume', top: 'TOP SCORES'
  },
  colors: {                          // CUSTOMIZE: any CSS colours
    bg: '#12151c', bg2: '#1d2332', text: '#f4f6f8', accent: '#ff7a1a', ball: '#ffd23f', paddle: '#9fb3c8',
    brick: ['#e63946', '#ff7a1a', '#ffd23f', '#2ec4b6', '#4895ef']   // brick colours for digits 1..5
  },
  lives: 3,                          // CUSTOMIZE: starting lives
  ballSpeed: 300,                    // CUSTOMIZE: ball speed in px/second at level 1 (screen is 640 px tall)
  ballSpeedMax: 520,                 // CUSTOMIZE: speed cap
  paddleWidth: 84,                   // CUSTOMIZE: paddle width (bigger = easier)
  powerupChance: 0.14,               // CUSTOMIZE: chance a broken brick drops a power-up (0 = none)
  levels: [                          // CUSTOMIZE: add a level by adding an array of 8-character rows.
                                     //   1-5 = brick colour, 9 = tough brick (3 hits), . = empty
    ['11111111', '22222222', '33333333', '44444444'],
    ['9.9.9.9.', '.1.2.3.4', '9.9.9.9.', '.4.3.2.1', '55555555'],
    ['9......9', '19....91', '219..912', '3219912.', '44444444', '..5555..'],
    ['12345123', '51234512', '99999999', '12345123', '..9..9..']
  ],
  music: { bpm: 128, tracks: [       // CUSTOMIZE: tune (notes like C4 F#3, "." = rest; w = square|triangle|sawtooth|sine|noise)
    { w: 'square', v: .05, p: 'E4 . G4 . B4 . G4 . E4 . A4 . C5 . A4 .' },
    { w: 'triangle', v: .16, p: 'E2 . . E2 . . E2 . A2 . . A2 . . A2 .' },
    { w: 'noise', v: .035, len: .4, p: 'x . x . x . x . x . x . x . x x' }
  ] }
};

// ---------------------------------------------------------------- setup
const J = Juice, T = CONFIG.text, C = CONFIG.colors, PI2 = Math.PI * 2;
J.init({ id: CONFIG.id, title: CONFIG.title, player: CONFIG.player, str: { paused: T.paused, resume: T.resume } });
J.fit(document.getElementById('c'), { w: 360, h: 640, fixed: true, bg: C.bg });

// tiny immediate-mode UI: button() draws and registers a tap target for the next frame
let ui = [], uiNext = [];
function button(c, s, x, y, w, h, fn, col) {
  uiNext.push({ x: x - w / 2, y: y - h / 2, w, h, fn });
  const dn = J.pt.down && Math.abs(J.pt.x - x) < w / 2 && Math.abs(J.pt.y - y) < h / 2, k = dn ? .95 : 1;
  c.save(); c.translate(x, y); c.scale(k, k);
  c.fillStyle = 'rgba(0,0,0,.4)'; J.rr(c, -w / 2, -h / 2 + 5, w, h, h / 3); c.fill();
  c.fillStyle = col || C.accent; J.rr(c, -w / 2, -h / 2, w, h, h / 3); c.fill();
  J.txt(c, s, 0, 1, { size: h * .42, color: '#15181f', stroke: 0, max: w - 20 }); c.restore();
}
J.on('tap', (x, y) => { for (const b of ui) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { J.play('click'); b.fn(); return; } });

// ---------------------------------------------------------------- art (vector shapes, no image files)
function tire(c, x, y, r, a) {
  c.save(); c.translate(x, y); c.rotate(a || 0);
  c.fillStyle = '#262a33'; c.beginPath(); c.arc(0, 0, r, 0, PI2); c.fill();
  c.strokeStyle = '#14161b'; c.lineWidth = r * .13; c.beginPath();
  for (let i = 0; i < 14; i++) { const t = i * .4488; c.moveTo(Math.cos(t) * r * .84, Math.sin(t) * r * .84); c.lineTo(Math.cos(t) * r, Math.sin(t) * r); } c.stroke();
  c.fillStyle = '#3b4252'; c.beginPath(); c.arc(0, 0, r * .66, 0, PI2); c.fill();
  c.fillStyle = '#b8c4d0'; c.beginPath(); c.arc(0, 0, r * .46, 0, PI2); c.fill();
  c.fillStyle = '#5f6b7a';
  for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(Math.cos(i * 1.2566) * r * .27, Math.sin(i * 1.2566) * r * .27, r * .07, 0, PI2); c.fill(); }
  c.restore();
}
function nut(c, x, y, r, a, col) {
  c.save(); c.translate(x, y); c.rotate(a); c.fillStyle = col; c.beginPath();
  for (let i = 0; i < 6; i++) c.lineTo(Math.cos(i * 1.0472) * r, Math.sin(i * 1.0472) * r);
  c.closePath(); c.fill(); c.fillStyle = 'rgba(0,0,0,.5)'; c.beginPath(); c.arc(0, 0, r * .42, 0, PI2); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-r * .6, -r * .5); c.lineTo(0, -r * .86); c.stroke(); c.restore();
}
function drop(c, x, y, s, col) {
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = col; c.beginPath(); c.moveTo(0, -1);
  c.bezierCurveTo(.2, -.5, .7, -.1, .7, .35); c.arc(0, .35, .7, 0, Math.PI); c.bezierCurveTo(-.7, -.1, -.2, -.5, 0, -1); c.fill(); c.restore();
}
function wrenchPaddle(c, p) {
  const h = p.h, x = p.x, y = p.y + h / 2;
  c.fillStyle = C.paddle; J.rr(c, x - p.w / 2 + 6, y - h * .38, p.w - 12, h * .76, h * .3); c.fill();
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x - p.w / 2 + 12, y - h * .3, p.w - 24, 2);
  for (const s of [-1, 1]) {
    const hx = x + s * (p.w / 2 - 6);
    c.fillStyle = C.paddle; c.beginPath(); c.arc(hx, y, h * .95, 0, PI2); c.fill();
    c.fillStyle = C.bg; c.beginPath(); for (let i = 0; i < 6; i++) c.lineTo(hx + Math.cos(i * 1.0472) * h * .5, y + Math.sin(i * 1.0472) * h * .5); c.fill();
  }
}

// ---------------------------------------------------------------- game state
let st = 'title', score = 0, lives = 0, lvl = 0, combo = 0, bricks = [], caps = [], ball = { x: 0, y: 0, r: 7, vx: 0, vy: 0, sp: 300, a: 0 };
let pad = { x: 180, y: 544, w: 84, tw: 84, h: 14, tx: 180, vx: 0 }, tt = 0, rank = 0, bannerT = 0;
const NOTES = ['C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'D6', 'E6'];   // combo arpeggio

function startGame() { score = 0; lives = CONFIG.lives; lvl = 0; rank = 0; J.clearFx(); buildLevel(); J.music.start(CONFIG.music); }
function buildLevel() {
  const rows = CONFIG.levels[lvl % CONFIG.levels.length], bw = (J.W - 24) / 8; bricks = []; caps = []; combo = 0;
  rows.forEach((r, i) => [...r].forEach((ch, j) => {
    if (ch < '1' || ch > '9') return;
    const tough = ch === '9', n = +ch;
    bricks.push({ x: 12 + j * bw, y: 100 + i * 25, w: bw, h: 25, hp: tough ? 3 : 1, max: tough ? 3 : 1, col: tough ? '#8793a3' : C.brick[(n - 1) % C.brick.length], f: 0, dead: 0 });
  }));
  pad.w = pad.tw = CONFIG.paddleWidth; pad.y = J.H - 96; pad.x = pad.tx = J.W / 2;
  ball.sp = Math.min(CONFIG.ballSpeedMax, CONFIG.ballSpeed * (1 + .07 * lvl)); ball.r = 7; st = 'ready'; bannerT = 1.4;
}
function launch() {
  if (st !== 'ready') return; st = 'play'; J.play('jump', 1.3);
  const a = -Math.PI / 2 + J.rnd(-.35, .35); ball.vx = Math.cos(a) * ball.sp; ball.vy = Math.sin(a) * ball.sp;
}
function gameOver() {
  st = 'over'; rank = J.hs.add(score); J.music.stop(); J.play('lose'); J.vibe([40, 40, 80]);
  if (rank === 1) J.jingle('C5 E5 G5 C6 E6'); else J.jingle('G4 E4 C4', 'triangle');
}
function brickHit(b) {
  b.hp--; b.f = .12;
  if (b.hp > 0) { J.play('hit', 1.5); J.burst(ball.x, ball.y, { n: 5, color: '#cfd6de', spd: [40, 120] }); J.shake(.12); return; }
  b.dead = 1; combo++; const pts = 10 * b.max * Math.min(combo, 8); score += pts;
  J.feel(b.max > 1 ? 'medium' : 'small', b.x + b.w / 2, b.y + b.h / 2, b.col, '+' + pts);
  J.tone(J.hz(NOTES[(combo - 1) % NOTES.length]), .14, 'triangle', .13);
  if (Math.random() < CONFIG.powerupChance) caps.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, t: J.pick(['W', 'S', 'L']) });
  if (!bricks.some(k => !k.dead)) {
    st = 'clear'; bannerT = 2; J.feel('large', J.W / 2, J.H / 2, C.accent);
    J.burst(J.W / 2, J.H / 2, { n: 60, color: C.brick.concat([C.ball]), spd: [80, 320], grav: 260, life: [.8, 1.6], size: [3, 7] });
    J.jingle('C5 E5 G5 C6'); J.after(1.8, () => { lvl++; buildLevel(); });
  }
}
function power(t) {
  J.play('power'); J.vibe(20);
  if (t === 'W') { pad.tw = CONFIG.paddleWidth * 1.6; J.after(12, () => pad.tw = CONFIG.paddleWidth); J.text(pad.x, pad.y - 20, 'WIDE!', { color: C.paddle }); }
  if (t === 'S') { const s = ball.sp; ball.vx *= .7; ball.vy *= .7; ball.sp *= .7; J.after(8, () => { ball.sp = s; }); J.text(pad.x, pad.y - 20, 'SLOW', { color: C.brick[3] }); }
  if (t === 'L') { lives = Math.min(lives + 1, 6); J.text(pad.x, pad.y - 20, '+1 LIFE', { color: C.brick[0] }); }
}
function moveBall(dt) {
  const spd = Math.hypot(ball.vx, ball.vy), want = Math.min(ball.sp, CONFIG.ballSpeedMax); if (spd > 0) { ball.vx *= want / spd; ball.vy *= want / spd; }
  let dx = ball.vx * dt, dy = ball.vy * dt, rem = 1;
  const pr = { x: pad.x - pad.w / 2 - 6, y: pad.y, w: pad.w + 12, h: pad.h };
  for (let it = 0; it < 5 && rem > 0; it++) {
    const mx = dx * rem, my = dy * rem; let best = null, hb = null, isPad = 0;
    for (const b of bricks) { if (b.dead) continue; const h = J.sweepCircle(ball.x, ball.y, ball.r, mx, my, b); if (h && (!best || h.t < best.t)) { best = h; hb = b; } }
    if (ball.vy > 0) { const h = J.sweepCircle(ball.x, ball.y, ball.r, mx, my, pr); if (h && h.ny < 0 && (!best || h.t < best.t)) { best = h; isPad = 1; } }
    if (!best) { ball.x += mx; ball.y += my; break; }
    ball.x += mx * best.t + best.nx * .02; ball.y += my * best.t + best.ny * .02; rem *= 1 - best.t;
    if (isPad) {
      const o = J.clamp((ball.x - pad.x) / (pad.w / 2 + 6), -1, 1), a = o * 1.05, s = Math.hypot(ball.vx, ball.vy);
      ball.vx = Math.sin(a) * s + pad.vx * .05; ball.vy = -Math.cos(a) * s; ball.sp = Math.min(CONFIG.ballSpeedMax, ball.sp + 4); combo = 0;
      J.play('click', 1 + o * .3); J.burst(ball.x, pad.y, { n: 6, color: C.paddle, angle: -Math.PI / 2, spread: .8, spd: [50, 130] }); J.shake(.1); J.vibe(8);
      pad.sq = .25; dx = ball.vx * dt; dy = ball.vy * dt;
    } else {
      if (best.nx) ball.vx = Math.abs(ball.vx) * best.nx; if (best.ny) ball.vy = Math.abs(ball.vy) * best.ny;
      dx = ball.vx * dt; dy = ball.vy * dt; brickHit(hb);
    }
  }
  const top = 76;
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); J.play('tick', .8); }
  if (ball.x > J.W - ball.r) { ball.x = J.W - ball.r; ball.vx = -Math.abs(ball.vx); J.play('tick', .8); }
  if (ball.y < top + ball.r) { ball.y = top + ball.r; ball.vy = Math.abs(ball.vy); J.play('tick', .9); }
  if (ball.vy < 0 && Math.abs(ball.vy) < 40) ball.vy = -40;             // never get stuck bouncing flat
}

function update(dt) {
  tt += dt; bannerT = Math.max(0, bannerT - dt);
  if (st === 'title' || st === 'over') return;
  const k = (J.keys.ArrowRight || J.keys.KeyD ? 1 : 0) - (J.keys.ArrowLeft || J.keys.KeyA ? 1 : 0); if (k) pad.tx += k * 460 * dt;
  pad.tx = J.clamp(pad.tx, pad.w / 2, J.W - pad.w / 2); const ox = pad.x;
  pad.x += (pad.tx - pad.x) * Math.min(1, dt * 24); pad.vx = (pad.x - ox) / dt; pad.w += (pad.tw - pad.w) * Math.min(1, dt * 8); pad.sq = Math.max(0, (pad.sq || 0) - dt);
  for (const b of bricks) b.f = Math.max(0, b.f - dt);
  if (st === 'ready') { ball.x = pad.x; ball.y = pad.y - ball.r - 1; return; }
  if (st === 'play') {
    moveBall(dt); J.burst(ball.x, ball.y, { n: 1, spd: [0, 10], life: [.15, .3], size: [3, 5], shape: 'c', color: C.ball });
    for (let i = caps.length; i--;) {
      const p = caps[i]; p.y += 120 * dt;
      if (J.overlap({ x: p.x - 12, y: p.y - 14, w: 24, h: 28 }, { x: pad.x - pad.w / 2 - 8, y: pad.y - 4, w: pad.w + 16, h: pad.h + 8 })) { power(p.t); caps.splice(i, 1); }
      else if (p.y > J.H + 20) caps.splice(i, 1);
    }
    if (ball.y > J.H + ball.r) {
      lives--; combo = 0; J.shake(.5); J.vibe([30, 40, 30]);
      if (lives <= 0) gameOver(); else { st = 'ready'; J.play('lose'); J.text(J.W / 2, J.H / 2, lives + (lives === 1 ? ' LIFE LEFT' : ' LIVES LEFT'), { size: 26, color: C.accent }); }
    }
  }
}

// ---------------------------------------------------------------- drawing
function bg(c) {
  const g = c.createLinearGradient(0, 0, 0, J.H); g.addColorStop(0, C.bg2); g.addColorStop(1, C.bg);
  c.fillStyle = g; c.fillRect(-30, -30, J.W + 60, J.H + 60);
  c.strokeStyle = 'rgba(255,255,255,.04)'; c.lineWidth = 2; c.beginPath();
  for (let y = 120; y < J.H; y += 70) { c.moveTo(0, y); c.lineTo(J.W, y); } c.stroke();
  c.fillStyle = 'rgba(255,255,255,.05)'; c.fillRect(0, 74, J.W, 2);
  c.save(); c.beginPath(); c.rect(-30, J.H - 22, J.W + 60, 52); c.clip();            // hazard stripe at the bottom
  c.fillStyle = C.ball; c.fillRect(-30, J.H - 22, J.W + 60, 52); c.fillStyle = '#15181f';
  for (let x = -60 + (tt * 20) % 40; x < J.W + 40; x += 40) { c.beginPath(); c.moveTo(x, J.H + 30); c.lineTo(x + 20, J.H + 30); c.lineTo(x + 50, J.H - 22); c.lineTo(x + 30, J.H - 22); c.fill(); }
  c.restore();
}
function draw(c) {
  ui = uiNext; uiNext = [];
  bg(c);
  for (const b of bricks) {
    if (b.dead) continue;
    const dmg = b.max - b.hp, x = b.x + 1, y = b.y + 1, w = b.w - 2, h = b.h - 2;
    c.fillStyle = b.f > 0 ? '#fff' : b.col; J.rr(c, x, y, w, h, 5); c.fill();
    c.fillStyle = 'rgba(255,255,255,.28)'; J.rr(c, x + 2, y + 2, w - 4, 4, 2); c.fill();
    c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x + 3, y + h - 5, w - 6, 3);
    c.fillStyle = 'rgba(0,0,0,.35)'; for (const sx of [x + 7, x + w - 7]) { c.beginPath(); c.arc(sx, y + h / 2, 2.4, 0, PI2); c.fill(); }
    if (b.max > 1) { c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = 1.5; c.beginPath(); if (dmg > 0) { c.moveTo(x + w * .4, y); c.lineTo(x + w * .5, y + h * .5); c.lineTo(x + w * .35, y + h); } if (dmg > 1) { c.moveTo(x + w * .7, y); c.lineTo(x + w * .6, y + h * .6); c.lineTo(x + w * .75, y + h); } c.stroke(); }
  }
  for (const p of caps) { drop(c, p.x, p.y, 15, p.t === 'W' ? C.paddle : p.t === 'S' ? C.brick[3] : C.brick[0]); J.txt(c, p.t, p.x, p.y + 5, { size: 13, stroke: 0, color: '#15181f' }); }
  if (st !== 'title' && st !== 'over') {
    c.save(); const sq = 1 + (pad.sq || 0) * .5; c.translate(pad.x, pad.y + pad.h / 2); c.scale(1, 1 / sq); c.translate(-pad.x, -pad.y - pad.h / 2); wrenchPaddle(c, pad); c.restore();
    nut(c, ball.x, ball.y, ball.r + 2, tt * 6, C.ball);
  }
}
function hud(c) {
  const W = J.W, H = J.H;
  if (st === 'title') {
    tire(c, W / 2, H * .3, 70 + Math.sin(tt * 2) * 4, tt * .8);
    J.txt(c, CONFIG.title, W / 2, H * .5, { size: 40, max: W - 40, color: C.accent }); J.txt(c, CONFIG.tagline, W / 2, H * .5 + 34, { size: 17, max: W - 40 });
    button(c, T.play, W / 2, H * .66, 200, 62, () => { startGame(); }); J.txt(c, T.best + ' ' + J.hs.best(), W / 2, H * .66 + 58, { size: 16, color: C.ball });
    J.txt(c, CONFIG.shop, W / 2, H - 34, { size: 15, max: W - 40, color: '#aab4c0' });
  } else if (st === 'over') {
    c.fillStyle = 'rgba(12,14,20,.9)'; c.fillRect(0, 0, W, H);
    J.txt(c, T.over, W / 2, H * .17, { size: 40, color: C.brick[0], max: W - 40 }); J.txt(c, T.score + ' ' + score, W / 2, H * .25, { size: 28, color: C.text });
    if (rank === 1) J.txt(c, 'NEW BEST!', W / 2, H * .31, { size: 20, color: C.ball });
    J.txt(c, T.top, W / 2, H * .38, { size: 16, color: '#aab4c0' }); J.hs.draw(c, W / 2, H * .43, { size: 17, w: 200, n: 4, hi: C.ball });
    const ls = J.wrap(c, CONFIG.cta, W - 60, 17); ls.forEach((l, i) => J.txt(c, l, W / 2, H * .64 + i * 22, { size: 17, color: C.accent }));
    button(c, T.again, W / 2, H * .8, 220, 62, () => { startGame(); }); J.txt(c, CONFIG.shop, W / 2, H - 34, { size: 15, max: W - 40, color: '#aab4c0' });
  } else {
    J.txt(c, T.score + ' ' + score, W / 2, 28, { size: 22, max: 150 }); J.txt(c, T.level + ' ' + (lvl + 1), W / 2, 52, { size: 13, color: '#aab4c0' });
    for (let i = 0; i < lives; i++) tire(c, 20 + i * 24, 64, 10, i);
    if (st === 'ready' && bannerT <= 0) J.txt(c, T.launch, W / 2, H * .62, { size: 24, color: C.ball, max: W - 40 });
    if (st === 'clear') J.txt(c, T.clear, W / 2, H * .45, { size: 38, color: C.accent, max: W - 40 });
    else if (bannerT > 0 && st === 'ready') J.txt(c, T.level + ' ' + (lvl + 1), W / 2, H * .5, { size: 44, color: C.accent });
  }
}

// ---------------------------------------------------------------- controls
const snd = J.btn({ x: 28, y: 30, r: 20, label: (c, x, y) => J.icon(c, 'snd', x, y, 22, J.opts.sound), onpress: () => J.setOpt('sound'), key: 'KeyM' });
const pause = J.btn({ x: () => J.W - 28, y: 30, r: 20, label: (c, x, y) => J.icon(c, 'pause', x, y, 20), onpress: () => J.pause(), key: 'KeyP' });
J.on('down', x => { if (st === 'ready' || st === 'play') pad.tx = x; if (st === 'ready' && bannerT <= 0) launch(); });
J.on('move', x => { if (st === 'ready' || st === 'play') pad.tx = x; });
addEventListener('keydown', e => { if (e.code === 'Space') { if (st === 'ready') launch(); else if (st === 'title') startGame(); else if (st === 'over') startGame(); } });
J.on('resume', () => { J.unlock(); });
window.__qa.info = () => ({ st, score, lives, lvl, bricks: bricks.filter(b => !b.dead).length, ball: [Math.round(ball.x), Math.round(ball.y)] });
J.loop({ update, draw, hud });
</script>
</body>
</html>
